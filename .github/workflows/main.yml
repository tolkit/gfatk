on:
  release:
    types: [created]

jobs:
  release:
    name: release ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-gnu
            archive: zip
          - target: x86_64-unknown-linux-musl
            archive: tar.zst
          - target: x86_64-apple-darwin
            archive: zip
    steps:
      - uses: actions/checkout@master
      - name: Compile and release
        uses: rust-build/rust-build.action@v1.4.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the container's bundled osxcross SDK only supports targeting up
          # to macOS 10.10; a modern rustc otherwise defaults to 10.12+.
          MACOSX_DEPLOYMENT_TARGET: "10.10"
        with:
          RUSTTARGET: ${{ matrix.target }}
          ARCHIVE_TYPES: ${{ matrix.archive }}
          # the action's bundled toolchain predates Cargo.lock v4 (needs
          # Cargo 1.78+); force a current stable toolchain instead.
          TOOLCHAIN_VERSION: stable
